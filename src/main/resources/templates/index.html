<!DOCTYPE html>
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" th:href="@{css/Static.css}">
</head>
<body>
    <div> 
        <h1> Minhas Tarefas </h1>
        <h2> Adicionar Nova Tarefa</h2>
        <form th:action="@{/adicionar}" th:object="${novaTarefa}" method="post">
            <input 

            type="text" 
            th:field="*{titulo}" 
            placeholder="Titulo da Tarefa" 
            required 
            
            />

            <input

            type="text" 
            th:field="*{descricao}" 
            placeholder="Descricao da Tarefa" 
            
            />
            <button type="submit">Adicionar</button>

        </form>
        <hr />
        <h2> Tarefas Cadastradas</h2>
        <table>
            <thead> 
                <tr> 
                    <th>Título</th> 
                    <th>Descrição</th> 
                    <th>Status</th> 
                    <th>Data</th>
                    <th>Ações</th>  
                </tr>
            </thead>
            <tbody>
                <tr th:if="${paginaTarefas.empty}"> 
                    <td colspan="4" style="text-align: center">
                        Nenhuma tarefa cadastrada ainda...
                    </td>
                </tr> 
                <tr th:each="tarefa : ${paginaTarefas.content}">
                    <td th:text="${tarefa.titulo}">Título da Tarefa</td>
                    <td th:text="${tarefa.descricao}">Descrição da Tarefa</td>
                    <td th:text="${tarefa.isConcluida} ? 'Concluída' : 'Pendente'"
                    th:classappend="${tarefa.isConcluida} ? 'status-green' : 'status-red'">
                        Pendente  
                    </td>   
                    <td th:text="${tarefa.dataCriacao}">Data de Criação</td>
                    <td class="actions">
                        <a th:href="@{/excluir/{id}(id=${tarefa.id})}" class="btn-dele">Remover</a>
                    </td>
                </tr>
                        
            </tbody>
        </table>

        
        <div class="pagination">
        <div th:if="${paginaTarefas.totalPages > 1}">
          <a
            th:if="${!paginaTarefas.first}"
            th:href="@{/(page=${paginaTarefas.number - 1})}"
            class="btn"
            >Anterior</a
          >
          <span
            th:each="i : ${#numbers.sequence(0, paginaTarefas.totalPages - 1)}"
          >
            <a
              th:href="@{/(page=${i})}"
              th:text="${i + 1}"
              th:classappend="${i == paginaTarefas.number} ? 'active' : ''"
              style="margin: 0 5px"
            ></a>
          </span>

          <a
            th:if="${!paginaTarefas.last}"
            th:href="@{/(page=${paginaTarefas.number + 1})}"
            class="btn"
            >Próxima</a
          >
        </div>
      </div>
        
           
        
           
    </div>
</body>
</html>
